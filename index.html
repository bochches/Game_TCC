<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Central de Jogos</title>

    <link rel="stylesheet" href="css/login.css">

</head>

<body>

    <main class="pagina-login">

        <section class="lado-esquerdo">

            <div class="apresentacao">

                <div class="logo">
                    🎮
                </div>

                <h1>Central de Jogos</h1>

                <p>
                    Aprenda de uma forma divertida,
                    interativa e diferente.
                </p>

                <div class="materias">

                    <span>🧠 Lógica</span>
                    <span>⚡ Álgebra</span>
                    <span>🔵 Conjuntos</span>

                </div>

            </div>

        </section>


        <section class="lado-direito">

            <div class="login-container">

                <h2>Bem-vindo!</h2>

                <p class="subtitulo">
                    Entre na sua conta para continuar
                </p>


                <form id="formLogin">

                    <div class="campo">

                        <label for="matricula">
                            Matrícula
                        </label>

                        <input
                            type="matricula"
                            id="matricula"
                            placeholder="Digite sua matrícula"
                            required
                        >

                    </div>


                    <div class="campo">

                        <label for="senha">
                            Senha
                        </label>

                        <input
                            type="password"
                            id="senha"
                            placeholder="Digite sua senha"
                            required
                        >

                    </div>


                    <div
                        id="mensagem"
                        class="mensagem">
                    </div>


                    <button
                        type="submit"
                        class="botao-entrar">
                        <a href="central/index.html">

                        Entrar
                        </a>
                    </button>

                </form>


                <div class="separador">

                    <span>ou</span>

                </div>


                <p class="cadastro-texto">

                    Ainda não possui uma conta?

                    <a href="cadastro.html">
                        Criar conta
                    </a>

                </p>

                <a
                    href="admin/login-professor.html"
                    class="acesso-professor"
                >
                    🎓 Área do Professor
                </a>

            </div>

        </section>

    </main>


    <script src="js/login.js"></script>

</body>
