<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Professor | Central de Jogos</title>

    <link
        rel="stylesheet"
        href="css/admin.css"
    >

</head>

<body>

    <main class="login-admin">

        <div class="cartao-admin">

            <div class="icone-admin">
                🎓
            </div>

            <h1>
                Área do Professor
            </h1>

            <p>
                Acesse o painel administrativo
                da Central de Jogos.
            </p>


            <form id="loginProfessor">

                <!-- E-MAIL -->

                <div class="campo-admin">

                    <label for="emailProfessor">
                        E-mail
                    </label>

                    <input
                        type="email"
                        id="emailProfessor"
                        placeholder="E-mail do professor"
                        required
                    >

                </div>


                <!-- SENHA -->

                <div class="campo-admin">

                    <label for="senhaProfessor">
                        Senha
                    </label>

                    <input
                        type="password"
                        id="senhaProfessor"
                        placeholder="Senha"
                        required
                    >

                </div>


                <!-- MENSAGEM -->

                <div
                    id="mensagemAdmin"
                    class="mensagem-admin"
                ></div>


                <!-- BOTÃO -->

                <button type="submit"><a href="dashboard.html">
                        Entrar
                    </a>
                </button>
                    

            </form>


            <!-- VOLTAR -->

            <a href="../index.html">
                ← Voltar para login do aluno
            </a>

        </div>

    </main>


    <!-- AUTENTICAÇÃO -->

    <script src="../js/auth.js"></script>

    <!-- LOGIN DO PROFESSOR -->

    <script src="js/admin.js"></script>

</body>

</html>
