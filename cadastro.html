<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Cadastro | Central de Jogos</title>

    <link
        rel="stylesheet"
        href="css/cadastro.css">

</head>

<body>

    <main class="pagina-cadastro">


        <section class="cadastro-container">

            <div class="logo">
                🎮
            </div>


            <h1>
                Criar sua conta
            </h1>


            <p class="subtitulo">
                Cadastre-se para começar a jogar!
            </p>


            <form id="formCadastro">


                <div class="campo">

                    <label for="nome">
                        Nome
                    </label>

                    <input
                        type="text"
                        id="nome"
                        placeholder="Digite seu nome"
                        required
                    >

                </div>


                <div class="campo">

                    <label for="matricula">
                        Matrícula
                    </label>

                    <input
                        type="text"
                        id="matricula"
                        placeholder="Digite sua matrícula"
                        required
                    >

                </div>


                <div class="campo">

                    <label for="senha">
                        Senha
                    </label>

                    <input
                        type="password"
                        id="senha"
                        placeholder="Crie uma senha"
                        required
                    >

                </div>


                <div class="campo">

                    <label for="confirmarSenha">
                        Confirmar senha
                    </label>

                    <input
                        type="password"
                        id="confirmarSenha"
                        placeholder="Digite a senha novamente"
                        required
                    >

                </div>


                <div
                    id="mensagem"
                    class="mensagem">
                </div>


                <button
                    type="submit"
                    class="botao-cadastrar">

                    Criar conta

                </button>


            </form>


            <p class="login-texto">

                Já possui uma conta?

                <a href="index.html">
                    Fazer login
                </a>

            </p>


        </section>

    </main>


    <script src="js/cadastro.js"></script>

</body>

</html>
