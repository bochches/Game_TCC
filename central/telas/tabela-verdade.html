<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Quiz | Central de Jogos</title>
    
    <link rel="stylesheet" href="../telas/css/style.css">
</head>

<body>

    <main class="jogo-container">

        <!-- CABEÇALHO -->

        <header class="cabecalho">

            <a href="../index.html" class="voltar">
                ← Voltar
            </a>

            <div class="titulo">
                <span>🧠</span>

                <h1>Caça às Proposições</h1>
            </div>

            <div class="pontuacao">
                ⭐ <span id="pontos">0</span>
            </div>

        </header>


        <!-- PROGRESSO -->

        <section class="progresso-container">

            <div class="informacao-progresso">

                <span id="numeroQuestao">
                    Questão 1 de 10
                </span>

            </div>

            <div class="barra-progresso">

                <div
                    class="progresso"
                    id="barraProgresso">
                </div>

            </div>

        </section>


        <!-- ÁREA DO JOGO -->

        <section class="area-jogo">

            <div class="cartao-questao">

                <span class="categoria">
                    DESAFIO LÓGICO
                </span>

                <!-- A QUESTÃO APARECERÁ AQUI -->

                <div
                    class="questao"
                    id="textoQuestao">

                </div>


                <!-- ALTERNATIVAS -->

                <div class="alternativas">

                    <button
                        class="alternativa"
                        data-resposta="A">
                    </button>

                    <button
                        class="alternativa"
                        data-resposta="B">
                    </button>

                    <button
                        class="alternativa"
                        data-resposta="C">
                    </button>

                    <button
                        class="alternativa"
                        data-resposta="D">
                    </button>

                    <button
                        class="alternativa"
                        data-resposta="E">
                    </button>

                </div>

                <!-- FEEDBACK -->

                <div
                    class="feedback"
                    id="feedback">
                </div>


                <!-- BOTÃO PRÓXIMA -->

                <button
                    id="botaoProxima"
                    class="botao-proxima">

                    Próxima questão →

                </button>

            </div>

        </section>

    </main>


    <!-- TELA FINAL -->

    <section
        class="tela-final"
        id="telaFinal">

        <div class="resultado">

            <div class="trofeu">
                🏆
            </div>

            <h2>
                Jogo concluído!
            </h2>

            <p>
                Você completou o desafio
                Tabela Verdade.
            </p>

            <div class="resultado-pontos">

                ⭐ <span id="pontuacaoFinal">
                    0
                </span> pontos

            </div>

            <button
                id="jogarNovamente"
                class="botao-recomecar">

                Jogar novamente

            </button>

        </div>

    </section>


    <script src="js/script-tabela-verdade.js"></script>

</body>

</html>
